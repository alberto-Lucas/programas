name: Claude Usage Monitor

on:
  push:
    paths:
      - "ClaudeUsageMonitor/**"
      - ".github/workflows/claude-usage-monitor.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publicar .exe
        run: dotnet publish ClaudeUsageMonitor/ClaudeUsageMonitor.csproj -c Release -r win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageMonitor
          path: publish/ClaudeUsageMonitor.exe
